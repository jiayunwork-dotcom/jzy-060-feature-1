services:
  dashboard:
    build: .
    image: ops-dashboard:latest
    container_name: ops-dashboard
    ports:
      - "8080:8080"
    volumes:
      # 历史数据点 / 布局 / 告警规则 / 数据源开关 落到容器外可持久化的存储
      - dashboard-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - TICK_MS=1000
      - HISTORY_RETENTION_MS=86400000
      - ENABLE_TEST_API=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  dashboard-data:
